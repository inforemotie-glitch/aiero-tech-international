<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" role="img" aria-labelledby="aieroIntlLogoTitle">
  <title id="aieroIntlLogoTitle">Aiero Tech International</title>
  <defs>
    <linearGradient id="aieroIntlSphere" x1=".2" y1=".08" x2=".8" y2=".96">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset=".55" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="aieroIntlWing" x1="0" y1=".85" x2="1" y2=".1">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset=".5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="aieroIntlPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <clipPath id="aieroIntlGlobe"><circle cx="27" cy="28" r="21"/></clipPath>
    <mask id="aieroIntlWingCut" maskUnits="userSpaceOnUse" x="0" y="0" width="60" height="56">
      <rect width="60" height="56" fill="#FFFFFF"/>
      <path d="M1 38C14 51 40 47 56 9 40 37 16 43 1 38Z" fill="#000000" stroke="#000000" stroke-width="3.6" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Global meridian sphere -->
  <g mask="url(#aieroIntlWingCut)">
    <circle cx="27" cy="28" r="21" fill="url(#aieroIntlSphere)"/>
    <g clip-path="url(#aieroIntlGlobe)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M27 7v42" stroke-opacity=".5" stroke-width="1.5"/>
      <ellipse cx="27" cy="28" rx="8" ry="21" stroke-opacity=".6" stroke-width="1.5"/>
      <ellipse cx="27" cy="28" rx="15" ry="21" stroke-opacity=".3" stroke-width="1.2"/>
      <path d="M9.1 17A17.9 3.6 0 0 0 44.9 17" stroke-opacity=".42" stroke-width="1.3"/>
      <path d="M6 28A21 4.5 0 0 0 48 28" stroke-opacity=".3" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Sweeping aero wing -->
  <path d="M1 38C14 51 40 47 56 9 40 37 16 43 1 38Z" fill="url(#aieroIntlWing)"/>

  <!-- Wordmark -->
  <text x="66" y="27" textLength="178" lengthAdjust="spacing" font-family="'Space Grotesk', 'Plus Jakarta Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A">AIERO <tspan fill="#4F46E5">TECH</tspan></text>

  <!-- International pill badge -->
  <rect x="66" y="33" width="178" height="17" rx="8.5" fill="url(#aieroIntlPill)"/>
  <circle cx="76" cy="41.5" r="2.2" fill="#22D3EE"/>
  <circle cx="234" cy="41.5" r="2.2" fill="#22D3EE"/>
  <text x="155" y="45.3" text-anchor="middle" textLength="132" lengthAdjust="spacing" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">INTERNATIONAL</text>
</svg>
